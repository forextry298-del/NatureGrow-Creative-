<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17120f"><title>NatureGrow Creative</title>
<link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
<header class="top"><a class="back" href="{{url_for('dashboard')}}" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a><b>{% block heading %}NatureGrow Creative{% endblock %}</b></header>
<main>{% with ms=get_flashed_messages(with_categories=true) %}{% for cat,msg in ms %}<div class="notice {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
{% if active_user %}<nav class="bottom-nav" aria-label="Main navigation">
<a class="{{'active' if request.endpoint=='dashboard' else ''}}" href="{{url_for('dashboard')}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></svg><small>Home</small></a>
<a class="{{'active' if request.endpoint in ['product_list','invest'] else ''}}" href="{{url_for('product_list')}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 5-9 5-9-5 9-5ZM3 7v10l9 5 9-5V7M12 12v10"/></svg><small>Products</small></a>
<a class="{{'active' if request.endpoint=='team' else ''}}" href="{{url_for('team')}}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 4a4 4 0 0 1 0 8M18 14a6 6 0 0 1 4 5v2"/></svg><small>Team</small></a>
<a class="{{'active' if request.endpoint in ['settings','projects','withdraw','history','checkin','support'] else ''}}" href="{{url_for('settings')}}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><small>Mine</small></a>
</nav>{% endif %}
</body></html>
