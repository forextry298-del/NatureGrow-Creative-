{% extends "base.html" %}{% block heading %}Products{% endblock %}{% block content %}
{% for p in products %}<article class="product"><img src="{{url_for('static',filename='images/'+p.image)}}" alt="{{p.name}}"><div class="info"><div class="row"><b>{{p.name}}</b><strong>{{money(p.price)}}</strong></div><p>Daily <span class="blue">{{money(p.daily)}}</span></p><p>Validity <b>60 days</b></p><p>Total <span class="blue">{{money(p.daily*60)}}</span></p><form method="post" action="{{url_for('invest',pid=p.id)}}"><button class="dark invest-btn">Invest Now</button></form></div></article>{% endfor %}{% endblock %}
