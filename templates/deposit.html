{% extends "base.html" %}{% block heading %}Deposit{% endblock %}{% block content %}<section class="card compact-card"><h2>Deposit</h2><form method="post"><label>Amount (UGX)<input id="amount" type="number" min="5000" step="1000" name="amount" required placeholder="Enter amount"></label><div class="amounts">{% for n in [40000,50000,100000,250000,500000,1000000,2000000,5000000] %}<button type="button" onclick="document.getElementById('amount').value={{n}}">{{'{:,}'.format(n)}}</button>{% endfor %}</div><label>Mobile Money Number<input name="phone" required inputmode="tel" placeholder="07XXXXXXXX"></label><div class="network-pills"><span>MTN Mobile Money</span><span>Airtel Money</span></div><p class="muted tiny">Requests stay pending until payment is verified.</p><button class="dark full">Submit Request</button></form></section>{% endblock %}
